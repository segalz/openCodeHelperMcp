name: linux-port
on:
  push:
    branches: [linux-support]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: npm ci
      # The hosted Windows runner's %TEMP% is an 8.3 short path (C:\Users\RUNNER~1\...); use the long runner temp folder.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: npm test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - name: Test
        if: runner.os != 'Windows'
        run: npm test
